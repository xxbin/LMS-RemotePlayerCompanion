name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # create the release and upload its asset
  pages: write        # deploy the listing
  id-token: write     # required by actions/deploy-pages

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: --generate-notes looks for the previous
          # release, and a shallow checkout has neither.
          fetch-depth: 0

      - name: Build the zip and the listing
        run: python3 build.py --tag "$GITHUB_REF_NAME"

      # Idempotent on purpose. If the release is created and a later step fails
      # -- Pages not yet enabled, a transient deploy error -- re-running the
      # workflow has to be able to finish the job. `gh release create` refuses
      # a tag that already has a release, so a plain create would strand the
      # listing at the one moment someone is trying to repair it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="build/RemotePlayerCompanion-${GITHUB_REF_NAME#v}.zip"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Stage the listing for Pages
        run: |
          mkdir -p _site
          cp build/repo.xml _site/repo.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy the listing
        id: deploy
        uses: actions/deploy-pages@v4
